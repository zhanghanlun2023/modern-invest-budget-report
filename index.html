<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>现代投资股份有限公司 · 合并报表系统（框架原型）</title>
<!-- 错误捕获必须放在所有脚本之前：否则前面脚本抛的异常会漏掉，
     只留下后面脚本的次生错误，无法定位 -->
<script>
window.__DSH_ERRS = [];
window.onerror = function (msg, src, ln, col) {
  var f = String(src || '').split('/').pop();
  window.__DSH_ERRS.push(msg + '  @ ' + f + ':' + ln + ':' + col);
  var b = document.getElementById('errbar');
  if (b) {
    b.hidden = false;
    b.innerHTML += '<div><b>JS 异常：</b>' + msg +
      ' <span style="color:#991b1b">@ ' + f + ':' + ln + ':' + col + '</span></div>';
  }
};
</script>
<link rel="stylesheet" href="assets/app.css?v=20261028c">
</head>
<body>

<div id="errbar" class="errbar" hidden></div>

<!-- ══════════════ 顶部标题栏 ══════════════ -->
<header class="topbar">
  <div class="brand">
    <span class="logo">现</span>
    <div class="brand-txt">
      <div class="b1">现代投资股份有限公司</div>
      <div class="b2">合并报表系统 &nbsp;·&nbsp; 框架原型 v0.1</div>
    </div>
  </div>

  <div class="topbar-mid">
    <label class="fld"><span>报表任务</span>
      <select id="task">
        <option value="budget">预算</option>
        <option value="final">决算（待完善）</option>
      </select>
    </label>
    <label class="fld"><span>报表期间</span>
      <select id="period"></select>
    </label>
    <label class="fld"><span>年度</span>
      <select id="year"></select>
    </label>
    <label class="fld"><span>版本</span>
      <select id="ver">
        <option value="up">对上报告版</option>
        <option value="down">对下目标任务分解版</option>
      </select>
    </label>
    <label class="fld"><span>金额单位</span>
      <select id="unit">
        <option value="1">元</option>
        <option value="10000" selected>万元</option>
      </select>
    </label>
  </div>

  <div class="topbar-right">
    <span class="pill" id="pillScope">汇总范围 0 户</span>
    <span class="pill" id="pillMode">单户填报态</span>
  </div>
</header>

<!-- ══════════════ 功能工具条 ══════════════ -->
<div class="toolbar">
  <button class="tb" id="btnFill">① 单户填报</button>
  <button class="tb primary" id="btnSum">② 自下而上汇总</button>
  <button class="tb" id="btnCons">③ 合并抵销</button>
  <button class="tb" id="btnElim">大合并调整项</button>
  <button class="tb" id="btnImport">导入 Excel</button>
  <input type="file" id="fileXls" accept=".xls,.xlsx,.xlsm" multiple style="display:none">
  <button class="tb" id="btnCloudSave">提交到服务器</button>
  <button class="tb" id="btnCloudLoad">从服务器读取</button>
  <span class="tb-sep"></span>
  <button class="tb" id="btnCheck">审核校验</button>
  <button class="tb" id="btnExport">导出 Excel</button>
  <button class="tb" id="btnDemo" title="默认报表为空白；点此载入虚构的演示数据，用于查看汇总/合并效果">载入演示数据</button>
  <button class="tb" id="btnReset">重置数据</button>
  <span class="spacer"></span>
</div>

<!-- ══════════════ 主体：左树 + 右表 ══════════════ -->
<main class="body">
  <aside class="treewrap" id="treewrap">
    <div class="panel-h">
      <span>组织单位树</span>
      <span class="spacer"></span>
      <span class="hint" id="treeCount">—</span>
    </div>
    <div class="tree-actions">
      <button class="mini" id="tAll">全选</button>
      <button class="mini" id="tNone">清空</button>
      <button class="mini" id="tLeaf">选已报</button>
      <button class="mini" id="tExp">展开</button>
      <button class="mini" id="tCol">收起</button>
    </div>
    <div class="tree" id="tree"></div>
    <div class="legend">
      <span><i class="dot d-audited"></i>已审核</span>
      <span><i class="dot d-filled"></i>已填报</span>
      <span><i class="dot d-draft"></i>未填报</span>
      <span><i class="dot d-virtual"></i>汇总分层</span>
      <span><i class="dot d-adjust"></i>调整项</span>
    </div>
  </aside>

  <div class="gutter" id="gutterTree" title="拖动调整组织树宽度（也可双击复位）"></div>

  <section class="mainwrap">
    <div class="tabs" id="tabs"></div>
    <div class="panes" id="panes"></div>
  </section>
</main>

<!-- ══════════════ 底部抽屉：抵销分录 / 明细 ══════════════ -->
<div class="drawer" id="drawer" hidden>
  <div class="gutter-h" id="gutterDrawer" title="拖动调整高度"></div>
  <div class="drawer-h">
    <span id="drawerTitle">抵销分录</span>
    <span class="spacer"></span>
    <button class="mini" id="dGen">重新自动生成</button>
    <button class="mini" id="dAdd">新增手工分录</button>
    <button class="mini" id="dClose">关闭 ✕</button>
  </div>
  <div class="drawer-b" id="drawerBody"></div>
</div>

<!-- ══════════════ 状态栏 ══════════════ -->
<footer class="statusbar">
  <span class="sb-item" id="sbScope">汇总范围：—</span>
  <span class="sb-sep"></span>
  <span class="sb-item" id="sbSum">汇总：—</span>
  <span class="sb-sep"></span>
  <span class="sb-item" id="sbElim">抵销：—</span>
  <span class="sb-sep"></span>
  <span class="sb-item" id="sbCheck">校验：—</span>
  <span class="spacer"></span>
  <span class="sb-tip" id="sbTip">流程：左侧勾选单位 →「自下而上汇总」→「合并抵销」→「审核校验」</span>
</footer>

<div class="modal" id="modal" hidden><div class="modal-box" id="modalBox"></div></div>

<script charset="utf-8" src="assets/sheetjs.min.js"></script>
<script charset="utf-8" src="src/data.org.js?v=20261010a"></script>
<script charset="utf-8" src="src/data.tables.js?v=20261010a"></script>
<script charset="utf-8" src="src/data.indicators.js?v=20261028a"></script>
<script charset="utf-8" src="src/engine.js?v=20261028e"></script>
<script charset="utf-8" src="src/seed.js?v=20261028c"></script>
<script charset="utf-8" src="src/cloud.js?v=20261028g"></script>
<script charset="utf-8" src="src/app.js?v=20261028g"></script>
</body>
</html>
